<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" type="image/png" href="favicon.ico" />
    <title>Black Screen Online - Eyestrain Relief & Ambient Display</title>
    <meta
      name="description"
      content="A minimal black screen overlay for screen testing, ambient displays, eye relaxation, and dust cleaning."
    />
    <meta name="robots" content="index, follow" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Top Single Row App Header -->
    <header class="app-header">
      <div class="header-left">
        <div id="clock" aria-live="off" aria-label="Current time"></div>
      </div>
      <div class="header-center">
        <!-- Ambient text display -->
        <span
          id="custom-text"
          class="custom-text-display"
          title="Click to edit focus text"
          role="button"
          tabindex="0"
          style="display: none;"
        ></span>
        <!-- Pencil placeholder shown when empty -->
        <button
          id="pencil-btn"
          class="icon-btn empty-pencil"
          title="Click to edit focus text"
          aria-label="Configure Ambient Text"
        >
          <i class="fas fa-pencil-alt"></i>
        </button>
        <!-- Inline input box hidden by default -->
        <input
          type="text"
          id="custom-text-input"
          class="inline-text-input"
          placeholder="Type custom text..."
          maxlength="100"
          autocomplete="off"
          style="display: none;"
          aria-label="Ambient focus text"
        />
      </div>
      <div class="header-right">
        <!-- Top-right controls toolbar -->
        <nav class="toolbar" aria-label="Controls">
          <!-- Burger menu button toggling the color popover -->
          <button
            id="menu-btn"
            class="icon-btn"
            popovertarget="menu-popover"
            title="Background Colors"
            aria-label="Toggle Color Menu"
          >
            <i class="fas fa-bars"></i>
          </button>

          <!-- Fullscreen button -->
          <button
            id="fullscreen-toggle"
            class="icon-btn"
            title="Toggle Fullscreen (F)"
            aria-label="Toggle Fullscreen"
          >
            <i class="fas fa-expand"></i>
          </button>
        </nav>
      </div>
    </header>

    <!-- Native Popover for background colors -->
    <div id="menu-popover" popover>
      <div class="popover-card">
        <h3>Predefined Colors</h3>
        <div class="presets-grid" id="presets-grid">
          <button class="color-dot active" data-color="#000000" style="background-color: #000000;" title="Pure Black" aria-label="Pure Black"></button>
          <button class="color-dot" data-color="#1e293b" style="background-color: #1e293b;" title="Slate Gray" aria-label="Slate Gray"></button>
          <button class="color-dot" data-color="#0f172a" style="background-color: #0f172a;" title="Night Blue" aria-label="Night Blue"></button>
          <button class="color-dot" data-color="#022c22" style="background-color: #022c22;" title="Forest Green" aria-label="Forest Green"></button>
          <button class="color-dot" data-color="#3b0764" style="background-color: #3b0764;" title="Deep Purple" aria-label="Deep Purple"></button>
          <button class="color-dot" data-color="#1c1917" style="background-color: #1c1917;" title="Charcoal" aria-label="Charcoal"></button>
          <button class="color-dot" data-color="#27272a" style="background-color: #27272a;" title="Zinc" aria-label="Zinc"></button>
          <button class="color-dot" data-color="#52525b" style="background-color: #52525b;" title="Steel Gray" aria-label="Steel Gray"></button>
        </div>
        
        <div class="custom-color-container">
          <span class="custom-color-label">
            <i class="fas fa-palette"></i> Custom Color
          </span>
          <div class="picker-wrapper">
            <input type="color" id="custom-color-picker" title="Choose Custom Color" aria-label="Choose Custom Color" value="#000000" />
          </div>
        </div>
      </div>
    </div>



    <script src="script.js"></script>
  </body>
</html>
